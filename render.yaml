services:
  - type: web
    name: classroom-agents
    runtime: python
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
      - key: APP_BASE_URL
        sync: false
      # No shared ANTHROPIC_API_KEY for the web chat on purpose — every user
      # brings their own key from the browser (see README: "מפתח API אישי").
      - key: CLASSROOM_MODEL
        value: claude-sonnet-5-5
      - key: CLASSROOM_VERIFIER_MODEL
        value: claude-haiku-5-5
      # No shared SLACK_ANTHROPIC_API_KEY either — each Slack user registers
      # their own personal key with /classroom-key (see README: "Slack").
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: classroom-agents-db
          property: connectionString

databases:
  - name: classroom-agents-db
    plan: free
