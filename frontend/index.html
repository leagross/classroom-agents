<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כיתה של סוכנים</title>
<style>
  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --radius: 16px;
    --shadow: 0 10px 30px -12px rgba(17, 24, 39, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% -10%, #e0e7ff 0%, var(--bg) 45%);
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  #app {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  /* ---------- Setup screen ---------- */
  #setup {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  #setup h2 {
    margin: 0;
    font-size: 26px;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #setup p { margin: 0; color: var(--muted); }
  #setup input {
    padding: 14px 16px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #setup input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
  }
  #setup button#startBtn {
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    color: #fff;
    cursor: pointer;
    transition: transform .1s, filter .15s;
  }
  #setup button#startBtn:hover { filter: brightness(1.08); }
  #setup button#startBtn:active { transform: scale(0.98); }

  #poolChoices { display: flex; flex-wrap: wrap; gap: 10px; }
  .pool-card {
    flex: 1 1 45%;
    min-width: 150px;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .pool-card:hover { transform: translateY(-1px); }
  .pool-card.selected { border-color: var(--accent); background: #eef2ff; }
  .pool-card.disabled { opacity: .4; cursor: not-allowed; }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .avatar.sm { width: 32px; height: 32px; font-size: 15px; }

  /* ---------- Chat ---------- */
  #topicBar {
    padding: 10px 20px;
    font-size: 13px;
    color: var(--muted);
    display: none;
    border-bottom: 1px solid var(--border);
    background: #fafafe;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: none;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(180deg, #fbfbff 0%, #f6f7fb 100%);
  }

  .msg-row { display: flex; gap: 8px; align-items: flex-end; animation: rise .22s ease-out; }
  .msg-row.user { flex-direction: row-reverse; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg {
    max-width: 75%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .msg .name { font-size: 12px; font-weight: 700; margin-bottom: 3px; opacity: .9; }
  .msg.user-bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { color: #fff; border-bottom-left-radius: 4px; }

  .typing-row { display: flex; gap: 8px; align-items: flex-end; }
  .typing-bubble {
    padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px;
    display: flex; gap: 4px; align-items: center;
  }
  .typing-bubble .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .85;
    animation: bounce 1s infinite ease-in-out;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: .15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  /* ---------- Input bar ---------- */
  #inputBar {
    display: none;
    padding: 14px;
    border-top: 1px solid var(--border);
    gap: 8px;
    background: #fff;
  }
  #inputBar input {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #inputBar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
  }
  #inputBar button {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, filter .15s;
    flex-shrink: 0;
  }
  #inputBar button:active { transform: scale(0.92); }
  #sendBtn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
  #sendBtn:hover { filter: brightness(1.08); }

  #micBtn { background: #f3f4f6; color: #374151; }
  #micBtn:hover { background: #e5e7eb; }
  #micBtn.listening {
    background: #ef4444; color: #fff;
    animation: pulse 1.1s infinite;
  }
  #micBtn:disabled { opacity: .35; cursor: not-allowed; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, .5); }
    70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  .hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="setup">
    <h2>🎓 כיתה של סוכנים</h2>
    <p>איזה נושא תרצה ללמוד היום?</p>
    <input id="topicInput" placeholder="למשל: אלגברה לינארית, מלחמת העולם הראשונה, פוטוסינתזה...">

    <p class="hint">בחר ידנית 2 "תלמידים" שישתתפו בשיעור, או השאר לא-בחור ותן למערכת לבחור אוטומטית לפי הנושא:</p>
    <div id="poolChoices"></div>

    <button id="startBtn" onclick="startSession()">התחל שיעור</button>
  </div>
  <div id="topicBar"></div>
  <div id="chat"></div>
  <div id="inputBar">
    <button id="micBtn" title="הקלטה קולית">🎤</button>
    <input id="messageInput" placeholder="כתוב כאן, או לחץ על המיקרופון..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_BASE = "";
let sessionId = null;
let poolAgents = [];
let selectedKeys = [];

function initials(name) {
  return name.replace(/^ה/, "").slice(0, 2);
}

function avatarEl(name, color, small) {
  const span = document.createElement("div");
  span.className = "avatar" + (small ? " sm" : "");
  span.style.background = color;
  span.textContent = initials(name);
  return span;
}

async function loadAgents() {
  const res = await fetch(API_BASE + "/api/agents");
  const data = await res.json();
  poolAgents = data.pool;
  const container = document.getElementById("poolChoices");
  container.innerHTML = "";
  poolAgents.forEach(agent => {
    const card = document.createElement("div");
    card.className = "pool-card";
    card.dataset.key = agent.key;
    card.appendChild(avatarEl(agent.name, agent.color));
    const label = document.createElement("span");
    label.textContent = agent.name;
    card.appendChild(label);
    card.onclick = () => toggleAgent(agent.key, card);
    container.appendChild(card);
  });
}

function toggleAgent(key, card) {
  const idx = selectedKeys.indexOf(key);
  if (idx >= 0) {
    selectedKeys.splice(idx, 1);
    card.classList.remove("selected");
  } else {
    if (selectedKeys.length >= 2) return;
    selectedKeys.push(key);
    card.classList.add("selected");
  }
  document.querySelectorAll(".pool-card").forEach(c => {
    const isSelected = selectedKeys.includes(c.dataset.key);
    c.classList.toggle("disabled", selectedKeys.length >= 2 && !isSelected);
  });
}

async function startSession() {
  const topic = document.getElementById("topicInput").value.trim();
  if (!topic) return;
  const body = { topic };
  if (selectedKeys.length === 2) body.pool_keys = selectedKeys;

  const res = await fetch(API_BASE + "/api/session", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    alert("בחר בדיוק 2 תלמידים, או אל תבחר כלל (בחירה אוטומטית).");
    return;
  }
  const data = await res.json();
  sessionId = data.session_id;
  document.getElementById("setup").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  document.getElementById("inputBar").style.display = "flex";
  const topicBar = document.getElementById("topicBar");
  topicBar.style.display = "block";
  topicBar.textContent = `נושא: ${data.topic} · הרכב הכיתה: המורה, ${data.pool.map(a => a.name).join(", ")}`;
}

function addMessage(name, color, text, isUser) {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg-row " + (isUser ? "user" : "");

  const bubble = document.createElement("div");
  bubble.className = "msg " + (isUser ? "user-bubble" : "agent");
  if (!isUser) bubble.style.background = color;
  const nameDiv = document.createElement("div");
  nameDiv.className = "name";
  nameDiv.textContent = isUser ? "את/ה" : name;
  const textDiv = document.createElement("div");
  textDiv.textContent = text;
  bubble.appendChild(nameDiv);
  bubble.appendChild(textDiv);

  row.appendChild(avatarEl(isUser ? "את/ה" : name, isUser ? "#374151" : color, true));
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping(name, color) {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "typing-row";
  const bubble = document.createElement("div");
  bubble.className = "typing-bubble";
  bubble.style.background = color;
  bubble.innerHTML = "<span class='dot'></span><span class='dot'></span><span class='dot'></span>";
  row.appendChild(avatarEl(name, color, true));
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text || !sessionId) return;
  addMessage(null, null, text, true);
  input.value = "";

  const res = await fetch(API_BASE + "/api/message", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId, text})
  });
  const data = await res.json();
  for (const reply of data.replies) {
    const typingRow = addTyping(reply.agent, reply.color);
    await new Promise(r => setTimeout(r, 500 + Math.random() * 400));
    typingRow.remove();
    addMessage(reply.agent, reply.color, reply.text, false);
  }
}

/* ---------- Microphone (Web Speech API) ---------- */
const micBtn = document.getElementById("micBtn");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

if (!SpeechRecognition) {
  micBtn.disabled = true;
  micBtn.title = "הדפדפן הזה לא תומך בהקלטה קולית (נסה Chrome)";
} else {
  recognizer = new SpeechRecognition();
  recognizer.lang = "he-IL";
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;

  recognizer.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById("messageInput");
    input.value = (input.value ? input.value + " " : "") + transcript;
  };
  recognizer.onerror = () => stopListening();
  recognizer.onend = () => stopListening();

  micBtn.onclick = () => {
    if (listening) {
      recognizer.stop();
    } else {
      listening = true;
      micBtn.classList.add("listening");
      try { recognizer.start(); } catch (e) { stopListening(); }
    }
  };
}

function stopListening() {
  listening = false;
  micBtn.classList.remove("listening");
}

loadAgents();
</script>
</body>
</html>
